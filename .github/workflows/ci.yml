name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Windows Direct3D 11 Check & Test
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check Streak Core
        run: cargo check --bin streak --verbose

      - name: Cargo Build Streak Core
        run: cargo build --release --bin streak --verbose

      - name: Cargo Check Setup
        run: cargo check -p streak-setup --verbose
